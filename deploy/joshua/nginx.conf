server {
    listen 80;
    server_name zetour.bonamy.fr;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ze-tour/current;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    http2 on;
    listen 443 ssl;
    server_name zetour.bonamy.fr;

    ssl_certificate /etc/letsencrypt/live/zetour.bonamy.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zetour.bonamy.fr/privkey.pem;

    root /var/www/ze-tour/current;
    index index.html;
    charset UTF-8;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|webp|svg|woff2?|mp3|ogg)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    access_log off;
    sendfile on;
}
